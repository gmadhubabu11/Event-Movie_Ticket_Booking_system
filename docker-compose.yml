services:
  mysql:
    image: mysql:8
    environment:
      MYSQL_ROOT_PASSWORD: rootpass
      MYSQL_DATABASE: ticketdb
    ports: ["3306:3306"]
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-prootpass"]
      interval: 5s
      timeout: 5s
      retries: 20
  redis:
    image: redis:7
    command: ["redis-server", "--notify-keyspace-events", "Ex"]
    ports: ["6379:6379"]
  app:
    build: .
    env_file: .env.example
    environment:
      DATABASE_URL: mysql+pymysql://root:rootpass@mysql:3306/ticketdb
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      mysql: {condition: service_healthy}
      redis: {condition: service_started}
    volumes:
      - ./tickets:/code/tickets
