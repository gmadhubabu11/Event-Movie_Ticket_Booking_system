<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Live Seat Map Test</title>
<style>
  body { font-family: Arial, sans-serif; margin: 20px; }
  input, button { padding: 6px 10px; margin-right: 6px; }
  #grid { margin-top: 20px; }
  .row { display: flex; align-items: center; margin-bottom: 6px; }
  .row-label { width: 28px; font-weight: bold; }
  .seat { width: 34px; height: 30px; margin-right: 4px; border-radius: 5px; font-size: 11px;
          display: flex; align-items: center; justify-content: center; color: #fff; }
  .Available { background: #2e9e4f; } .Locked { background: #e69a1a; } .Booked { background: #d33; }
  .Unavailable { background: #999; } .Yours { background: #1d6fe0; }
  #log { margin-top: 20px; font-size: 13px; max-height: 160px; overflow: auto; background: #f4f4f4; padding: 8px; }
  .legend span { display: inline-block; padding: 2px 8px; margin-right: 6px; color: #fff; border-radius: 4px; font-size: 12px; }
</style>
</head>
<body>
<h2>Live Seat Map</h2>
<div>
  <input id="token" placeholder="Access token" size="50">
  <input id="show" placeholder="Show ID" size="8" value="1">
  <button onclick="connect()">Connect</button>
  <button onclick="disconnectWs()">Disconnect</button>
  <span id="status">disconnected</span>
</div>
<p class="legend">
  <span class="Available">Available</span><span class="Locked">Locked</span><span class="Booked">Booked</span>
  <span class="Unavailable">Unavailable</span><span class="Yours">Yours</span>
</p>
<div id="grid"></div>
<div id="log"></div>
<script>
let ws = null;
const seats = {};   // seat_id -> {label,row_label,seat_number,status}

function log(msg) {
  const d = document.getElementById("log");
  d.innerHTML = new Date().toLocaleTimeString() + " - " + msg + "<br>" + d.innerHTML;
}
function render() {
  const rows = {};
  Object.values(seats).forEach(s => (rows[s.row_label] = rows[s.row_label] || []).push(s));
  const grid = document.getElementById("grid");
  grid.innerHTML = "";
  Object.keys(rows).sort((a, b) => a.length - b.length || a.localeCompare(b)).forEach(r => {
    const div = document.createElement("div");
    div.className = "row";
    div.innerHTML = '<div class="row-label">' + r + "</div>";
    rows[r].sort((a, b) => a.seat_number - b.seat_number).forEach(s => {
      const el = document.createElement("div");
      el.className = "seat " + s.status;
      el.textContent = s.seat_number;
      el.title = s.label + " - " + s.status;
      div.appendChild(el);
    });
    grid.appendChild(div);
  });
}
function connect() {
  disconnectWs();
  const token = document.getElementById("token").value.trim();
  const show = document.getElementById("show").value.trim();
  const proto = location.protocol === "https:" ? "wss" : "ws";
  ws = new WebSocket(proto + "://" + location.host + "/ws/shows/" + show + "/seats?token=" + encodeURIComponent(token));
  ws.onopen = () => { document.getElementById("status").textContent = "connected"; };
  ws.onclose = () => { document.getElementById("status").textContent = "disconnected"; };
  ws.onmessage = (e) => {
    const m = JSON.parse(e.data);
    if (m.type === "seat_map") {
      Object.keys(seats).forEach(k => delete seats[k]);
      m.seats.forEach(s => seats[s.seat_id] = s);
      log("Full seat map received (" + m.seats.length + " seats)");
    } else if (m.type === "seat_update") {
      m.seats.forEach(u => { if (seats[u.seat_id]) seats[u.seat_id].status = u.status; });
      log(m.message);
    } else if (m.type === "notification" || m.type === "show_cancelled") {
      log("NOTIFICATION: " + m.message);
    }
    render();
  };
}
function disconnectWs() { if (ws) { ws.close(); ws = null; } }
</script>
</body>
</html>
